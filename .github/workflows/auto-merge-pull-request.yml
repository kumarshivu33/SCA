name: Auto-Merge Pull Request

# Trigger when validation workflow completes successfully
on:
  workflow_run:
    workflows: [Validation in Salesforce]
    types: [completed]

# Permissions needed for auto-merge
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    
    # Only run if validation succeeded
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find associated PR
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the head branch from the completed workflow run
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          BASE_BRANCH="${{ github.event.workflow_run.base_branch }}"
          
          echo "Head branch: $HEAD_BRANCH"
          echo "Base branch: $BASE_BRANCH"
          
          # Find the PR associated with this branch
          PR_DATA=$(gh pr list \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --json number,title,body,labels,draft,mergeable,statusCheckRollup \
            --limit 1)
          
          if [ -z "$PR_DATA" ] || [ "$PR_DATA" = "[]" ]; then
            echo "No open PR found for branch $HEAD_BRANCH against $BASE_BRANCH"
            exit 0
          fi
          
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number')
          PR_DRAFT=$(echo "$PR_DATA" | jq -r '.[0].draft')
          PR_MERGEABLE=$(echo "$PR_DATA" | jq -r '.[0].mergeable')
          
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr-draft=$PR_DRAFT" >> $GITHUB_OUTPUT
          echo "pr-mergeable=$PR_MERGEABLE" >> $GITHUB_OUTPUT
          echo "Found PR: #$PR_NUMBER (Draft: $PR_DRAFT, Mergeable: $PR_MERGEABLE)"

      - name: Verify PR prerequisites for auto-merge
        id: check-prerequisites
        if: steps.find-pr.outputs.pr-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.find-pr.outputs.pr-number }}"
          
          # Fetch full PR details
          PR_DATA=$(gh pr view "$PR_NUMBER" --json \
            number,title,draft,mergeable,reviews,statusCheckRollup,labels \
            --jq '.')
          
          # Extract prerequisites check data
          IS_DRAFT=$(echo "$PR_DATA" | jq -r '.draft')
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          REVIEWS=$(echo "$PR_DATA" | jq -r '.reviews | length')
          
          # Get status checks
          STATUS_CHECKS=$(echo "$PR_DATA" | jq -r '.statusCheckRollup[] | .conclusion' 2>/dev/null | sort | uniq)
          REVIEWS_APPROVED=$(echo "$PR_DATA" | jq -r '[.reviews[] | select(.state == "APPROVED")] | length')
          REVIEWS_REQUESTED=$(echo "$PR_DATA" | jq -r '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | length')
          
          echo "PR #$PR_NUMBER Prerequisites:"
          echo "  Draft: $IS_DRAFT"
          echo "  Mergeable: $MERGEABLE"
          echo "  Reviews Approved: $REVIEWS_APPROVED"
          echo "  Changes Requested: $REVIEWS_REQUESTED"
          echo "  Status Check Conclusion: $STATUS_CHECKS"
          
          # Check if auto-merge is disabled
          SKIP_MERGE=$(echo "$PR_DATA" | jq -r '.labels[] | select(.name == "skip-auto-merge") | .name' | head -1)
          
          # Prerequisites for auto-merge:
          # 1. Not a draft
          # 2. Mergeable status is true
          # 3. No "changes requested" reviews
          # 4. No skip-auto-merge label
          
          CAN_MERGE="true"
          REASON=""
          
          if [ "$IS_DRAFT" == "true" ]; then
            CAN_MERGE="false"
            REASON="PR is still in draft mode"
          elif [ "$MERGEABLE" != "true" ]; then
            CAN_MERGE="false"
            REASON="PR has merge conflicts"
          elif [ "$REVIEWS_REQUESTED" -gt 0 ]; then
            CAN_MERGE="false"
            REASON="PR has unresolved change requests"
          elif [ -n "$SKIP_MERGE" ]; then
            CAN_MERGE="false"
            REASON="PR has skip-auto-merge label"
          elif echo "$STATUS_CHECKS" | grep -q "FAILURE\|FAILURE\|NEUTRAL"; then
            CAN_MERGE="false"
            REASON="PR has failing status checks"
          fi
          
          echo "can-merge=$CAN_MERGE" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          
          if [ "$CAN_MERGE" == "false" ]; then
            echo "❌ Auto-merge blocked: $REASON"
            exit 0
          fi
          
          echo "✅ All prerequisites met for auto-merge"

      - name: Auto-merge PR
        if: steps.check-prerequisites.outputs.can-merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.find-pr.outputs.pr-number }}"
          
          # Attempt merge with squash strategy (recommended for clean history)
          echo "🚀 Merging PR #$PR_NUMBER..."
          
          if gh pr merge "$PR_NUMBER" \
            --squash \
            --auto \
            --delete-branch; then
            echo "✅ PR #$PR_NUMBER merged successfully!"
          else
            echo "⚠️ Merge attempt initiated (may be in progress)"
          fi

      - name: Comment on PR if auto-merge blocked
        if: |
          steps.find-pr.outputs.pr-number &&
          steps.check-prerequisites.outputs.can-merge == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = ${{ steps.find-pr.outputs.pr-number }};
            const reason = `${{ steps.check-prerequisites.outputs.reason }}`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `⏸️ **Auto-Merge Blocked**\n\nValidation passed, but auto-merge cannot proceed:\n\n**Reason:** ${reason}\n\nPlease resolve and the PR will merge automatically on the next successful validation run.`
            });

      - name: Comment on PR if auto-merge successful
        if: steps.check-prerequisites.outputs.can-merge == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = ${{ steps.find-pr.outputs.pr-number }};
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `✅ **Auto-Merged**\n\nThis PR has been automatically merged after validation passed all checks.`
            });
